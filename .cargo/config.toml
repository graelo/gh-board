# Deny cargo warnings (e.g. `cargo::unused_dependencies`) the same way the
# CI does via actions-rust-lang/setup-rust-toolchain's CARGO_BUILD_WARNINGS.
[build]
warnings = "deny"

[target."cfg(all())"]
rustflags = [
  "-Wclippy::pedantic",
  "-Aclippy::module_name_repetitions",
  "-Aclippy::must_use_candidate",
  "-Aclippy::missing_errors_doc",
]
