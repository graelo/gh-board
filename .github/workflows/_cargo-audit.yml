# Reusable workflow: dependency audit via cargo-deny and cargo-pants.
#
# Local (standalone):
#   act workflow_call -W .github/workflows/_cargo-audit.yml

name: Cargo Audit

on:
  workflow_call:

permissions: {}

jobs:
  cargo-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny@0.19.6

      - name: Security – cargo deny
        run: cargo deny --locked check

      - name: Security – cargo pants
        run: |
          cargo install --locked cargo-pants || command -v cargo-pants
          cargo pants
